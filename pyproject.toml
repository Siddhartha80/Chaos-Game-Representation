[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-game-representation"
version = "0.1.0"
description = "Utilities for DNA k-mer counting and Frequency Chaos Game Representation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.setuptools]
packages = ["cgr"]
